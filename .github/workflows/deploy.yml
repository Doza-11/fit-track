name: Deploy web app to GitHub Pages

# Publishes the web/PWA build so it can be used in any browser — on a laptop
# with the desktop layout, or on a phone, where "Add to Home Screen" installs
# it. The Android APK is built separately and is not affected by this workflow.
#
# The build is pushed to the `gh-pages` branch, which is what the repository's
# Pages setting serves ("Deploy from a branch → gh-pages / root"). Publishing
# that way works with the existing setting; the earlier deploy-pages action
# needed the source switched to "GitHub Actions" and failed on every run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Don't publish a build that fails the calculation or tone tests.
      - run: npm test

      - run: npm run build

      # Plain git rather than a third-party action: the branch only ever holds
      # the latest build, so it is replaced wholesale on each deploy.
      - name: Publish dist/ to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Serve files as-is (no Jekyll processing of the build output).
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published ${GITHUB_SHA::7} to gh-pages"
